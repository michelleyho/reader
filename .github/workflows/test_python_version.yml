name: Run Tests
on:
  push:
    branches:
      - master
      - github-actions-tutorial
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:


jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
